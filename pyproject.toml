[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-sales-bot"
version = "0.1.2"
description = "Telegram bot for selling VPN subscriptions with admin panel, referrals, payments and 3x-ui integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7.0,<4.0.0",
  "SQLAlchemy>=2.0.30,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "redis>=5.0.4,<6.0.0",
  "aiohttp>=3.9.5,<4.0.0",
  "aiohttp-socks>=0.10.1,<0.11.0",
  "pydantic-settings>=2.3.4,<3.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "qrcode>=7.4.2,<8.0.0",
  "pillow>=10.3.0,<11.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

